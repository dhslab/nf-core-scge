# Relative path: circos resolves it against its own install dir, so this survives a container
# version bump. An absolute /circos-<version>/... path does not -- see make_circos_plot.nf.
karyotype = data/karyotype/karyotype.human.hg38.txt

<ideogram>
<spacing>
default = 0.005r
</spacing>
radius    = 0.75r
thickness = 30p
fill      = yes

# Add chromosome labels
show_label       = yes
label_font       = bold
label_radius     = dims(ideogram,radius_outer) + 0.1r
label_size       = 80p
# label_parallel   = yes


</ideogram>

<image>
<<include etc/image.conf>>
</image>

<plots>
type = tile
<plot>
show  = yes
file = __FILE_PLACEHOLDER__
r0 = 0.8r
r1 = 0.9r
stroke_thickness = 3
stroke_color = vvlblack

thickness   = 120p
padding     = 10
# Add glyph configuration for circular points
glyph           = circle
glyph_size      = 20p  # Adjust the size as needed
glyph_fill_color = red  # Change color as needed
glyph_stroke_color = black
glyph_stroke_thickness = 2p

</plot>
</plots>

<<include etc/colors_fonts_patterns.conf>>
<<include etc/housekeeping.conf>>
